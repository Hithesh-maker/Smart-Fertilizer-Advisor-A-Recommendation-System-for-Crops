[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-fertilizer-advisor"
version = "2.0.0"
description = "Production-ready precision agriculture & fertilizer recommendation platform with leakage-free scikit-learn pipeline, NPK diagnostics, Flask REST API, and SQLite history."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0.0",
  "scikit-learn>=1.5.0",
  "pandas>=2.2.0",
  "joblib>=1.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
